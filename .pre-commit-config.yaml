# Setup (once per clone): brew install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
# Keep the ruff rev in step with the ruff version in backend/uv.lock.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: shell-syntax
        name: bash -n (shell scripts)
        language: system
        entry: bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' --
        files: ^(scripts|deploy)/.*\.sh$
