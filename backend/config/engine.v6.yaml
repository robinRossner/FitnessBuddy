# FitnessBuddy engine configuration, version 6 (v5 + the progression engine v2: reps-at-load
# signal, two-strike gate, rung rule, censoring, per-lift stall ladder, multi-lift soft deload,
# reactive deloads, return after breaks; Friday quality cycle, pace-based interval pass, VDOT
# hysteresis, 4-week-mean volume cap, long-run step-back + drift gate, missed runs +-1 day).
# Specs: docs/research/lifting-progression.md, docs/research/running-progression.md, decisions in
# docs/spec/decisions.md. A running database gets the same keys as a derived version (migration
# 0010); this file seeds fresh databases once settings.engine_config_path points at it.
# This file is only the SEED of the `config_versions` table: after seeding, the database is the
# source of truth (the engine/advisor/user create derived versions v3.1, v3.2 ... with a diff,
# reason and author, and the active one can be rolled back). Do not edit it once used; copy to
# engine.v6.yaml and bump `version` instead.
version: v6

approval_mode: manual          # engine proposes, user approves every planned session

user:
  timezone: Europe/Vienna
  bodyweight_kg: 82            # fallback only: the body_measurements log wins (see app/bodyweight.py)

bodyweight:
  # Bodyweight (BW) is a context signal for the advisor, NOT a goal: the user wants to maintain.
  change_flag_pct_4w: 3.0      # flag to the advisor if BW moves by more than 3 % within 4 weeks

strength:
  rep_range: [7, 12]           # default; per exercise: exercise_overrides.<slug>.rep_range
  rir_target: [0, 1]           # fixed 0-1 reps in reserve; the engine never prescribes RPE/RIR
  # Performance signal = reps at a load. Progress event = load PR, rep PR at the same load, or
  # best-set e1RM +1 %. Stall = no progress event in N CLEAN sessions and >= 12 days.
  stall_exposures: 3           # N for lifts trained once a week (lower)
  stall_exposures_2x: 4        # N for lifts trained twice a week (upper)
  stall_min_days: 12
  e1rm_progress_pct: 1.0
  # Stall ladder per lift: -5 % and rebuild -> advisor (rep range / variation) -> -10 %
  stall_reset_small_pct: 5
  stall_reset_pct: 10          # the last resort
  multi_stall_lifts: 3         # >= 3 lifts stalled within 14 days -> ONE soft deload + retest
  multi_stall_days: 14
  noise_reps: 2                # a dip of 1-2 reps is noise: same target
  big_miss_reps: 3             # >= 3 reps fewer (or two clean drops in a row) -> one rung down
  rung_min_reps: 8             # the next load must predict >= 8 reps (Epley), else ...
  rep_ceiling_cap: 15          # ... the rep ceiling rises (max 15) until it does
  jump_abort_reps: 5           # first set <= 5 at a new load -> back at once (else one more try)
  decrease_load_if_first_set_below_range: true
  timed_step_s: 5              # timed holds (plank, L-sit): +5 s on the best hold of the last time
  deload:                      # reactive (fatigue index, red streak) or multi-lift stall
    sets_pct: 50               # sets halved ...
    sets_rounding: up          # ... rounded up (3 -> 2, 2 -> 1), min 1
    load_pct: 0                # loads kept
    days: 7
    min_gap_days: 28           # no second multi-lift / fatigue deload within 4 weeks
    fatigue_index_pct: 40      # misses + regressions >= 40 % of the clean sessions ...
    fatigue_weeks: 2           # ... two weeks in a row
    fatigue_min_exposures: 3
    align_running_step_back: true   # pull the long-run step-back forward into a deload week
  censor:                      # misses that do not count (hits always count)
    readiness: [yellow, red]
    hard_run_hours: 24         # lower-body lifts within 24 h after intervals / a long run
    hard_run_min_km: 10
    calibration_sessions: 2    # after a variant swap, a break >= 10 days or a gym change
    break_days: 10
  break_tiers:                 # return after a break (days since the lift's last session)
    - {min_days: 11, sets_minus: 1, days: 1}                   # same load, -1 set, first session
    - {min_days: 22, load_pct: 5, sets_minus: 1, days: 7}      # -5 %, -1 set, first week
    - {min_days: 43, load_pct: 10, sets_factor: 0.5, days: 7}  # -10 %, half the sets, first week
  e1rm:
    formula: epley             # e1RM = w * (1 + reps/30)
    max_reps: 15               # sets above this many reps are ignored for e1RM (Epley degrades)
    min_reps: 1

increments:
  barbell_kg: 5.0              # 2 x 2.5 kg plates
  smith_kg: 5.0                # 2 x 2.5 kg plates (assumption: same as barbell)
  plate_loaded_kg: 5.0         # 2 x 2.5 kg plates (assumption: same as barbell)
  dumbbell_increment_kg: 2.0   # user-selectable: 2.0 or 2.5 (depends on the gym's DB rack)
  default_stack_step_kg: 5.0   # machine_stack/cable: used when there is no ladder or the target
                               # is above the top rung of the variant's weight_ladder
  bodyweight_added_kg: 2.5     # pull-ups/dips with a belt: smallest plate
  other_kg: 2.5

recovery:
  deload_red_days: 4           # this many CONSECUTIVE red readiness days => deload week (7 days)
  hard_after_heavy_lower_h: 24 # no hard run (intervals) within 24 h after a heavy lower session
                               # -> day-level rule: at least 2 calendar days apart (see scheduling)

readiness:
  # Daily colour from daily_health (Garmin). Every signal is scored green / yellow / red:
  #   hrv        overnight HRV vs the mean of the previous `baseline_days` days (needs >=
  #              `min_baseline_days` values; else Garmin's own balanced range), plus Garmin's
  #              hrv_status (worst of both counts)
  #   rhr        resting HR vs the mean of the previous `baseline_days` days
  #   sleep      the worse of sleep duration and sleep score
  # Colour: any red => red; otherwise `yellow_signals_needed` yellow signals => yellow; else green.
  # Tuning: a red SLEEP signal alone (one short night, HRV and resting HR normal) is only yellow;
  # it becomes red when another signal is at least yellow too (`sleep_red_needs_corroboration`).
  # No data at all => "unknown", treated as green ("no data").
  baseline_days: 7
  min_baseline_days: 3
  hrv:
    yellow_pct: -10            # HRV >= 10 % below baseline
    red_pct: -20               # HRV >= 20 % below baseline
    garmin_status:             # Garmin hrv_status -> signal level
      UNBALANCED: yellow
      LOW: yellow
      POOR: red
  rhr:
    yellow_bpm: 5              # resting HR >= 5 bpm above baseline
    red_bpm: 8
  sleep:
    yellow_h: 6.0              # < 6 h
    red_h: 5.0                 # < 5 h
    yellow_score: 60
    red_score: 45
  yellow_signals_needed: 2
  sleep_red_needs_corroboration: true
  hrv_drop_anomaly:            # data-anomaly advisor trigger: HRV far below baseline for days
    pct: -15
    days: 3
  green: normal                # train as planned
  yellow:
    strength: same_effort_minus_one_set   # same load/effort, -1 working set per exercise (min 1)
    run: intervals_to_easy                # interval sessions become easy runs
  red:
    allowed: [rest, easy]      # red: lifting -> rest (optional mobility); intervals / long -> short
                               # easy run or rest; easy run -> shortened easy run
    easy_run_km: 4             # length of the short easy run offered on a red day

running:
  pace_model: vdot             # swappable: see app/engine/pace.py (`make_pace_model`)
  # Weekly cap = max(4-week mean x 1.10, 4-week mean + 2 km) of the ACTUAL km (volume section)
  weekly_volume_cap_pct: 10
  weekly_volume_floor_km: 18   # v6: a TARGET to progress toward, never an immediate jump
  interval_pace_tolerance_pct: 3   # a rep is on pace unless > 3 % slower than the target
  interval_fast_flag_pct: 5
  stagnation_weeks: 4          # efficiency / interval pace not improving for this long => advisor
  stagnation_min_improvement_pct: 1.0

  volume:
    mean_weeks: 4
    cap_abs_km: 2.0
    single_run_factor: 1.1     # one run <= 1.1 x the longest run of the last 30 days
    single_run_abs_km: 0.0
    single_run_days: 30
    min_run_km: 3.0            # the cap never shortens an easy or long run below this

  heart_rate:
    # Garmin (athlete_metrics, 2026-10-25): max HR 190, LTHR 171. `source: garmin` means a newer
    # Garmin value creates a new config version automatically (app/engine/config_service.py).
    max_hr: 190
    lthr: 171
    source: garmin
    # Zones are DERIVED from LTHR (never stored): Friel's running zones as % of LTHR. The numbers
    # are the inclusive UPPER bound of each zone; a zone starts one bpm above the previous one:
    #   Z1 < 85 %   Z2 85-89 %   Z3 90-94 %   Z4 95-99 %   Z5a 100-102 %   Z5b 103-106 %
    #   Z5c > 106 % (up to max HR)
    # (Friel, "The Triathlete's Training Bible"; Joe Friel's blog "Determining Training Zones
    # with LTHR".) At LTHR 171 that is Z1 <=145, Z2 146-152, Z3 153-161, Z4 162-169,
    # Z5a 170-174, Z5b 175-181, Z5c 182+ (bounds = round-half-up(pct * LTHR)).
    # Cleaner 5-zone view for display: Z1 = Z1, Z2 = Z2, Z3 = Z3, Z4 = Z4, Z5 = Z5a+Z5b+Z5c.
    zones_pct_lthr:
      z1: 0.85
      z2: 0.89
      z3: 0.94
      z4: 0.99
      z5a: 1.02
      z5b: 1.06
    # Easy-run ceiling = top of Friel Z2 (89 % LTHR, 152 bpm) ~ the aerobic threshold / VT1
    # (polarized-training Zone 1; Seiler & Kjerland 2006, Scand J Med Sci Sports; Seiler 2010,
    # IJSPP). Without LTHR: 80 % HRmax (VT1 typically sits at 77-80 % HRmax).
    easy_ceiling:
      pct_hrmax: 0.80
      pct_lthr: 0.89
    easy_low_pct_hrmax: 0.65   # lower end of a useful easy range (~124 bpm at HRmax 190)
    interval_zones: [z4, z5a]  # hard-rep target = from the bottom of Z4 to the top of Z5a

  vdot:
    # Seed fitness (Jack Daniels' VDOT) until hard efforts in the data say otherwise.
    seed_race: {distance_m: 10000, time_s: 3150}   # 10 km in 52:30 (user-provided)
    lookback_weeks: 12
    min_effort_km: 5           # best contiguous stretch of >= 5 km
    min_effort_hr_pct_lthr: 0.88   # only counts as a (near-)max effort if avg HR >= 88 % LTHR
    # Efforts can only RAISE the estimate above the seed (easy runs are not races).
    pace_step: 0.5             # one "faster" progression step = +0.5 VDOT on interval pace
    # v6 hysteresis: the fit above only anchors the first record (decisions_log); then
    max_step: 0.5              # at most +0.5 per update (one update per week)
    max_per_4w: 1.0            # at most +1.0 per 28 days
    green_sessions: 2          # 2 quality sessions passed easily within 3 weeks ...
    green_window_weeks: 3
    ef_trend_weeks: 4          # ... plus aerobic efficiency up >= 1 % (4 vs 4 weeks), or a
    ef_trend_min_pct: 1.0      # time trial / race effort; never lowered by one bad session
    fails_to_lower: 3          # 3 genuine fails within 4 weeks: -0.5
    fail_drop: 0.5
    layoff:                    # days without a run -> VDOT -x % (once per break)
      - {min_days: 15, pct: 2}
      - {min_days: 29, pct: 5}
      - {min_days: 57, pct: 8}

  easy:
    distance_km: 7
    pass_pct_time_at_or_below_cap: 80   # easy-run PASS: avg HR <= cap and >= 80 % of time <= cap
    decoupling_flag_pct: 5     # HR drift (pace:HR first vs second half) > 5 % => flag
    strides: {reps: 6, duration_s: 20, recovery_s: 60}   # every Wednesday easy run
    exempt_after_lower: true   # the day after lower body an HR fail is a note, not a fail

  intervals:                   # the VO2max session type (I pace) + the shared evaluation
    rep_distance_m: 1000
    recovery_distance_m: 400   # jog
    reps_start: 5              # first session without history
    reps_min: 4                # after a pace step the rep count resets to this
    reps_max: 6
    rep_ladder_m: [800, 1000, 1200]   # rep-length lever
    max_work_min: 20           # hard minutes per session
    warmup_km: 2.0
    cooldown_km: 1.5
    warmup_min_km: 1.0
    cooldown_min_km: 0.5
    hr_recovery_min_bpm: 12    # recovery-lap HR drop: a multi-week trend, never a fail
    pace_tolerance_s: 4        # +- around the target pace in the app
    pass_rep_share: 0.8        # PASS = >= 80 % of the reps on pace ...
    fade_max_pct: 3            # ... and the last rep <= 3 % slower than the first
    hr_ceiling_pct_lthr: 1.08  # last rep's peak HR above this: "passed hard", hold
    green_hr_pct_lthr: 1.02    # below this: "passed easily" (VDOT evidence)
    fails_to_step_back: 2      # 2 fails of the same session in 3 weeks: one rep less

  threshold:                   # T pace: reps -> rep length -> shorter recovery -> pace
    reps_start: 3
    reps_min: 3
    reps_max: 5
    rep_ladder_m: [1000, 1200, 1600, 2000]
    recovery_ladder_s: [90, 75, 60]
    max_work_min: 30
    hr_ceiling_pct_lthr: 0.99  # top of Z4
    green_hr_pct_lthr: 0.95    # bottom of Z4

  race_5k:                     # 5k race pace (from VDOT)
    reps_start: 6
    reps_min: 4
    reps_max: 6
    rep_ladder_m: [800, 1000, 1200]
    recovery_s: 120
    max_work_min: 20
    hr_ceiling_pct_lthr: 1.08
    green_hr_pct_lthr: 1.02

  time_trial: {distance_m: 5000, warmup_km: 2.0, cooldown_km: 1.5}

  quality:                     # the Friday cycle; a phase week counts only when it was run
    cycle_start: null          # ISO date to pin the start; else the engine's first record
    phases:
      - {name: threshold, weeks: 12, sessions: [threshold]}
      - {name: threshold_vo2max, weeks: 8, sessions: [threshold, vo2max]}
      - {name: 5k_specific, weeks: 6, sessions: [race_5k, threshold]}
      - {name: time_trial, weeks: 1, sessions: [time_trial]}
    phase_weeks: {}            # per-phase override of `weeks` (coach-tunable)
    no_quality_after_break_days: 15   # first week back after >= 15 days off: easy + strides

  fourth_run:                  # suggested to the coach (never added automatically) after
    consistent_weeks: 8        # 8 weeks with >= 3 runs each,
    min_runs_per_week: 3
    min_weekly_km: 28          # a 4-week mean >= 28 km
    min_long_run_km: 14        # and a long run >= 14 km in the last 4 weeks

  long_run:
    start_km: 10
    step_km: 1.0               # +1 km per week
    cap_km: 20                 # HM-oriented plateau (18-20 km)
    min_km: 8                  # a run this long counts as a long run (base of the progression)
    step_back_every: 4         # every 4th week a step-back ...
    step_back_pct: 25          # ... of -25 %
    drift_hold_pct: 5          # decoupling of the last long run > 5 % -> hold
    drift_cut_pct: 8           # > 8 % -> -10 %
    drift_cut_by_pct: 10
    drift_min_minutes: 60      # drift only judged on runs >= 60 min
    recent_days: 21

weekly_template:               # Mon..Sun
  mon: upper
  tue: lower
  wed: easy_run
  thu: upper
  fri: intervals
  sat: rest
  sun: long_run

schedule:                      # missed-session policy + hard scheduling rules (app/engine/makeup.py)
  # Priority of a make-up when sessions were missed. A missed lower / intervals session takes the
  # slot of an easy run (or the rest day); upper only if a later slot is free; a missed easy run
  # is dropped; a missed long run moves to `long_run_makeup_day` if that day is still ahead.
  makeup_priority: [lower, intervals, upper, long, easy]
  makeup_never: [easy]
  makeup_replaceable: [easy]   # planned kinds whose slot a make-up may take over
  makeup_use_rest_day: true
  long_run_makeup_day: sat     # legacy (v3-v5)
  run_makeup_max_shift_days: 1 # v6: a missed run moves at most 1 day, else it is dropped and the
                               # same session comes again next week (no volume is made up)
  # Hard rules (engine make-ups AND the coach's schedule changes; the 24 h rule after a heavy
  # lower day is recovery.hard_after_heavy_lower_h)
  hard_kinds: [lower, intervals]
  max_hard_per_day: 1
  no_consecutive_hard_days: true
  max_sessions_per_day: 2
  # Coach (Claude) schedule changes
  shorten_max_pct: 50          # `shorten` may cut a run by at most half
  horizon_weeks: 2             # current and next week only
  kind_load:                   # a `replace` may only go to an equal or easier kind
    rest: 0
    easy: 1
    upper: 2
    long: 3
    lower: 4
    intervals: 4

lifting:
  rest_default_s: 120          # rest timer for every exercise (2:00); 30..600
  # A different rest for one exercise is exercise_overrides.<slug>.rest_s (e.g. 180 for squat). The
  # user sets it in the app (PUT /api/v1/exercises/{variant_id}/rest), the coach may propose it.
