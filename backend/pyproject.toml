[project]
name = "fitnessbuddy-backend"
version = "0.1.0"
description = "FitnessBuddy backend: training data store, Strong importer, progression engine (later)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.162.0",
    "fitdecode>=0.11.0",
    "garminconnect>=0.3.20",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
]

[tool.uv]
# Application, not a library: no build step, `app` is imported from the backend/ dir.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `-n auto` runs the suite in parallel (pytest-xdist); pass `-n0` to run in one process, e.g. for
# a debugger, `-s` / print output or `--pdb`.
addopts = "-q --strict-markers -n auto"
# Group markers are added from the folder name by tests/conftest.py (`pytest -m engine` ==
# `pytest tests/engine`); `db` is added to every test that needs a migrated database.
markers = [
    "engine: planner, progression and running engine (tests/engine)",
    "advisor: Claude coach, summary, validator, consultations (tests/advisor)",
    "garmin: Garmin client, sync, mapping, workouts (tests/garmin)",
    "importers: Strong CSV parser, mapping and importer (tests/importers)",
    "api: HTTP API, auth and route prefixes (tests/api)",
    "gyms: gyms, machines and variant resolution (tests/gyms)",
    "sync: app sync push / pull (tests/sync)",
    "analytics: stats, bodyweight and the stats API (tests/analytics)",
    "withings: Withings client, OAuth state, sync, API and scheduler (tests/withings)",
    "db: uses a migrated SQLite database (deselect with -m 'not db' for a fast run)",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/fitness/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core", "server"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option"]

[tool.pyright]
# Basic mode on the pure / newest code first; widen `include` as modules get cleaned up.
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = true
include = [
    "core",
    "apps/fitness/engine/core",
    "apps/fitness/advisor/rules",
    "apps/fitness/garmin/pacing.py",
    "apps/fitness/errors.py",
    "apps/fitness/api/deps.py",
]
