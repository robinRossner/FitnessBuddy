[project]
name = "fitnessbuddy-backend"
version = "0.1.0"
description = "FitnessBuddy backend: training data store, Strong importer, progression engine (later)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.162.0",
    "fitdecode>=0.11.0",
    "garminconnect>=0.3.20",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
# Application, not a library: no build step, `app` is imported from the backend/ dir.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/fitness/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core", "server"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option"]
