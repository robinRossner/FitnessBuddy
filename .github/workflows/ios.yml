name: ios

# PRs: Fast test plan. main: Full test plan. The tests decode docs/api/examples/*.json.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "docs/api/examples/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "docs/api/examples/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-15
    # TEST_HOST: the app target builds too, and simulator boot is slow on hosted runners.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      PLAN: ${{ github.event_name == 'push' && 'Full' || 'Fast' }}
    steps:
      - uses: actions/checkout@v4
      - name: select newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n1)"
          echo "using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen xcbeautify
      - run: xcodegen generate
      - name: pick a simulator (newest iOS runtime, first iPhone)
        run: |
          sim="$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-[0-9]+"))
                  | {v: (.key | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)") | [(.a|tonumber), (.b|tonumber)]),
                     d: [.value[] | select(.name | startswith("iPhone"))]}
                  | select(.d | length > 0))
            | sort_by(.v) | last | .d[0] // empty | "\(.udid) \(.name)"')"
          [ -n "$sim" ] || { echo "no iPhone simulator available" >&2; xcrun simctl list devices available; exit 1; }
          echo "simulator: $sim"
          echo "SIM_UDID=${sim%% *}" >> "$GITHUB_ENV"
      - name: xcodebuild test (${{ env.PLAN }} plan)
        run: |
          set -o pipefail
          xcodebuild test -project FitnessBuddy.xcodeproj -scheme FitnessBuddy \
            -testPlan "$PLAN" -destination "id=$SIM_UDID" | xcbeautify
