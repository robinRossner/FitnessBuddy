# Production stack for a single Oracle Cloud Always Free ARM VM.
#   cd deploy && docker compose up -d --build
# The DB (fitness.db) and the other state live in ./data (host bind mount) so deploy/backup.sh can
# snapshot it from the host.
#
# The project name is pinned to what compose derived from the directory name (/opt/fitnessbuddy/deploy
# -> `deploy`), so the network `deploy_default` and the volumes `deploy_caddy_data` / `deploy_caddy_config`
# (Caddy's certificates!) keep their names. The Receipts server (separate repository, own
# stack in /opt/receipts) attaches to `deploy_default`.
name: deploy

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    # run as the host user (push.sh writes APP_UID/APP_GID to deploy/.env) so ./data is writable
    # for the app and readable for the host-side backup cron (WAL needs write access).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - ../backend/.env.production         # created by deploy/make-prod-env.sh (gitignored)
    environment:
      DATABASE_URL: sqlite:////app/var/fitness.db
    volumes:
      - ./data:/app/var
    # Only Caddy can reach the backend (no published port), so the peer of every request is the Caddy
    # container in this network's private range, which core/settings.py trusts by default for
    # X-Forwarded-For (the client IP behind the failed-token throttle); no configuration needed.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. fitness.example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
