name: FitnessBuddy
options:
  bundleIdPrefix: com.robinrossner
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FitnessBuddy:
    type: application
    platform: iOS
    sources:
      - path: FitnessBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrossner.FitnessBuddy
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FitnessBuddy/Resources/Info.plist
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - FitnessBuddyTests
      gatherCoverageData: false
  FitnessBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitnessBuddyTests
    dependencies:
      - target: FitnessBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrossner.FitnessBuddyTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitnessBuddy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FitnessBuddy"
        BUNDLE_LOADER: "$(TEST_HOST)"
