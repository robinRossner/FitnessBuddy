name: FitnessBuddy
options:
  bundleIdPrefix: com.robinrossner
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  # Foundation-only core (API client + DTOs, logic, transforms); `cd FitnessCore && swift test` is the fast loop.
  FitnessCore:
    path: FitnessCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FitnessBuddy:
    type: application
    platform: iOS
    sources:
      - path: FitnessBuddy
    dependencies:
      - package: FitnessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrossner.FitnessBuddy
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FitnessBuddy/Resources/Info.plist
        ENABLE_PREVIEWS: YES
  FitnessBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitnessBuddyTests
      # Test fixtures are the backend's generated API examples (one source of truth);
      # copied as a folder reference, so they live under `examples/` in the test bundle.
      - path: ../docs/api/examples
        type: folder
        buildPhase: resources
    dependencies:
      - target: FitnessBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrossner.FitnessBuddyTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitnessBuddy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FitnessBuddy"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # XCUITest target behind the screenpass screenshot walk (TestPlans/Screenpass.xctestplan only;
  # Full and Fast do not include it). AXID.swift is shared with the app so both use the same identifiers.
  FitnessBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitnessBuddyUITests
      - path: FitnessBuddy/App/AXID.swift
    dependencies:
      - target: FitnessBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinrossner.FitnessBuddyUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FitnessBuddy
schemes:
  FitnessBuddy:
    build:
      targets:
        FitnessBuddy: all
        FitnessBuddyTests: [test]
        FitnessBuddyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: TestPlans/Full.xctestplan
          defaultPlan: true
        - path: TestPlans/Fast.xctestplan
        - path: TestPlans/Screenpass.xctestplan
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
